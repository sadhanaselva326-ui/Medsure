version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: medsure_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: medsure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medsure_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: medsure_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/medsure_db
      - DEBUG=true
      - SECRET_KEY=medsure-secret-key-production-change
      - RATE_LIMIT_PER_MINUTE=100
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000,https://medsure.vision
    command: >
      sh -c "alembic upgrade head &&
             python scripts/data_ingestion/run_ingestion.py --source all &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
